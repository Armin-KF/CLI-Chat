# CLI-Chat Server Configuration

# Server settings
server_host = 0.0.0.0
server_port = 4000

# TLS/SSL settings
tls_enabled = true
cert_file = certs/server.crt
key_file = certs/server.key

# Database settings
database_path = data/chat.db

# Redis settings (for scaling)
redis_host = redis
redis_port = 6379
redis_password =

# Security settings
max_users = 1000
max_message_length = 4096
session_timeout = 86400

# Web interface settings
web_port = 8080
web_root = frontend/dist